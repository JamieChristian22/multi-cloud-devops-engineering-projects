name: DevOps repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check internal README references
        run: python scripts/check_readme_links.py
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate Python, YAML, JSON and shell syntax
        run: bash scripts/validate-all.sh
      - name: Exercise strict optional-tool error handling and GitOps manifest references
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  app-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-terraform-enterprise-deployment/app
          - 02-secure-cicd-automation-platform
          - 03-production-kubernetes-platform/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install project test requirements
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$PROJECT/requirements-dev.txt"
      - name: Run tests
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          cd "$PROJECT"
          python -m pytest tests -q
